name: ruisheng-prod

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set}
    platform: ${TARGET_PLATFORM:?TARGET_PLATFORM must be set}
    pull_policy: never
    container_name: ruisheng-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ruisheng
    volumes:
      - ruisheng-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ruisheng"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be set}
    platform: ${TARGET_PLATFORM:?TARGET_PLATFORM must be set}
    pull_policy: never
    container_name: ruisheng-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ruisheng-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:?API_IMAGE must be set}
    platform: ${TARGET_PLATFORM:?TARGET_PLATFORM must be set}
    pull_policy: never
    entrypoint: ["bash", "scripts/entrypoint-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ruisheng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RUISHENG_GW_PASSWORD: ${RUISHENG_GW_PASSWORD}
      RUISHENG_API_PASSWORD: ${RUISHENG_API_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    restart: "no"

  api:
    image: ${API_IMAGE:?API_IMAGE must be set}
    platform: ${TARGET_PLATFORM:?TARGET_PLATFORM must be set}
    pull_policy: never
    container_name: ruisheng-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      API_LISTEN_HOST: "0.0.0.0"
      API_DB_URL: postgresql+asyncpg://ruisheng_api:${RUISHENG_API_PASSWORD}@postgres:5432/ruisheng
      API_GW_DB_URL: postgresql+asyncpg://ruisheng_gw:${RUISHENG_GW_PASSWORD}@postgres:5432/ruisheng
      API_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_JWT_SECRET: ${JWT_SECRET}
      API_ENV: prod
      API_NOTIFICATION_WECHAT_ENABLED: ${API_NOTIFICATION_WECHAT_ENABLED:-false}
      API_NOTIFICATION_EMAIL_ENABLED: ${API_NOTIFICATION_EMAIL_ENABLED:-false}
      API_NOTIFICATION_EMAIL_HOST: ${API_NOTIFICATION_EMAIL_HOST:-}
      API_NOTIFICATION_EMAIL_PORT: ${API_NOTIFICATION_EMAIL_PORT:-587}
      API_NOTIFICATION_EMAIL_USER: ${API_NOTIFICATION_EMAIL_USER:-}
      API_NOTIFICATION_EMAIL_PASSWORD: ${API_NOTIFICATION_EMAIL_PASSWORD:-}
      API_NOTIFICATION_EMAIL_TLS: ${API_NOTIFICATION_EMAIL_TLS:-true}
      API_NOTIFICATION_SMS_ENABLED: ${API_NOTIFICATION_SMS_ENABLED:-false}
      API_NOTIFICATION_SMS_ENDPOINT: ${API_NOTIFICATION_SMS_ENDPOINT:-}
      API_NOTIFICATION_SMS_API_KEY: ${API_NOTIFICATION_SMS_API_KEY:-}
      API_NOTIFICATION_VOICE_ENABLED: ${API_NOTIFICATION_VOICE_ENABLED:-false}
      API_NOTIFICATION_VOICE_ENDPOINT: ${API_NOTIFICATION_VOICE_ENDPOINT:-}
      API_NOTIFICATION_VOICE_API_KEY: ${API_NOTIFICATION_VOICE_API_KEY:-}
      API_NOTIFICATION_WORKER_BATCH: ${API_NOTIFICATION_WORKER_BATCH:-20}
      API_NOTIFICATION_WORKER_CONCURRENCY: ${API_NOTIFICATION_WORKER_CONCURRENCY:-5}
      API_NOTIFICATION_LEASE_SEC: ${API_NOTIFICATION_LEASE_SEC:-60}
      API_NOTIFICATION_PROVIDER_TIMEOUT_SEC: ${API_NOTIFICATION_PROVIDER_TIMEOUT_SEC:-20}
      API_NOTIFICATION_MAX_ATTEMPTS: ${API_NOTIFICATION_MAX_ATTEMPTS:-5}
      API_NOTIFICATION_EVENT_MAX_AGE_SEC: ${API_NOTIFICATION_EVENT_MAX_AGE_SEC:-604800}
    restart: unless-stopped

  gw:
    image: ${GW_IMAGE:?GW_IMAGE must be set}
    platform: ${TARGET_PLATFORM:?TARGET_PLATFORM must be set}
    pull_policy: never
    container_name: ruisheng-gw
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      GW_LISTEN_HOST: "0.0.0.0"
      GW_LISTEN_PORT: "5020"
      GW_DATABASE_URL: postgresql+asyncpg://ruisheng_gw:${RUISHENG_GW_PASSWORD}@postgres:5432/ruisheng
      GW_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GW_WAL_DIR: /var/lib/ruisheng-gw/wal
      GW_ALARM_RELOAD_INTERVAL_SEC: ${GW_ALARM_RELOAD_INTERVAL_SEC:-5}
      GW_RELATION_VALUE_MAX_AGE_SEC: ${GW_RELATION_VALUE_MAX_AGE_SEC:-300}
    volumes:
      - ruisheng-gw-wal:/var/lib/ruisheng-gw/wal
    ports:
      - "5020:5020"
      - "9090:9090"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set}
    platform: ${TARGET_PLATFORM:?TARGET_PLATFORM must be set}
    pull_policy: never
    container_name: ruisheng-web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  ruisheng-pgdata:
  ruisheng-redisdata:
  ruisheng-gw-wal:
