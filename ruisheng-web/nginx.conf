# Keep request targets out of access logs: /ws carries the JWT in a query
# parameter until the WebSocket handshake contract is migrated.
log_format ruisheng_safe '$remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" $status '
                         '$body_bytes_sent';

server {
    listen 80;
    server_name _;
    # Error logs can include request targets; keep them off the candidate log stream.
    error_log /dev/null crit;

    access_log /dev/stdout ruisheng_safe;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health and metrics are an operations surface, not part of the user API.
    # The mounted site-health-acl.conf is the only place where site CIDRs are
    # selected; the image default allows loopback only and denies everything else.
    location = /api/health {
        include /etc/nginx/site-health-acl.conf;
        proxy_pass http://api:8000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location ^~ /api/health/ {
        include /etc/nginx/site-health-acl.conf;
        proxy_pass http://api:8000/api/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
