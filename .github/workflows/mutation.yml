name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'   # 每周日 02:00 UTC
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --all-packages --frozen --no-install-package ruisheng-shared
      - name: Run mutation tests
        run: uv run --no-sync mutmut run
        working-directory: ruisheng-shared
      - name: Show surviving mutants
        run: uv run --no-sync mutmut results
        working-directory: ruisheng-shared
      - name: Export mutation statistics
        run: uv run --no-sync mutmut export-cicd-stats
        working-directory: ruisheng-shared
      - name: Fail if survival rate > 10%
        working-directory: ruisheng-shared
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import sys

          with open("mutants/mutmut-cicd-stats.json", encoding="utf-8") as stats_file:
              stats = json.load(stats_file)

          survived = stats["survived"]
          no_tests = stats["no_tests"]
          alive = survived + no_tests
          total = sum(
              stats[key]
              for key in ("killed", "survived", "no_tests", "timeout", "suspicious")
          )
          if total == 0:
              print("No mutants analyzed; failing because the mutation run is invalid.")
              sys.exit(1)

          rate = alive / total
          print(
              f"survived={survived} no_tests={no_tests} "
              f"total={total} survival_rate={rate:.2%}"
          )
          sys.exit(1 if rate > 0.10 else 0)
          PY
